<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <style>
    body {
      background: #150720;
      color: #f7f3ea;
      font-family: Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 520px;
    }
    h1 {
      font-size: 48px;
      color: #f0d67f;
      margin: 0 0 10px;
    }
    p {
      font-size: 16px;
      color: #c9b6d8;
      margin: 0 0 20px;
    }
    a {
      display: inline-block;
      background: #d4a534;
      color: #150720;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
      margin-top: 20px;
    }
    a:hover {
      background: #f0d67f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Page not found</p>
    <p>The page you're looking for doesn't exist.</p>
    <a href="/">Return to Home</a>
  </div>
</body>
</html>
